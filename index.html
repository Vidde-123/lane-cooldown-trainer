<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0C0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Lane Cooldown Trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/scout"><span class="logo">&#9201;</span><span>Lane Cooldowns</span></a>
    <nav class="topnav" id="topnav" aria-label="Main"></nav>
    <span class="status" id="status" title="Data Dragon status"></span>
  </div>
</header>
<main id="view" class="wrap" tabindex="-1"></main>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<button class="fab" id="fab" aria-label="Search champion" hidden>
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
</button>
<div class="palette" id="palette" hidden>
  <div class="palette-box" role="dialog" aria-label="Champion search">
    <div class="palette-head"><span id="palette-target" class="chip"></span><span class="hint" id="palette-hint"></span></div>
    <input id="palette-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a champion (ahri, tf, j4...)" aria-label="Champion name">
    <ul id="palette-list" class="palette-list"></ul>
  </div>
</div>
<script defer src="data-champions.js"></script>
<script defer src="data-meta.js"></script>
<script defer src="engine.js"></script>
<script defer src="scout.js"></script>
<script defer src="trainer.js"></script>
<script defer src="app.js"></script>
</body>
</html>
